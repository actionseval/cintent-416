name: Unit Tests Minimum Versions

# CINTENT >> MANUAL_TRIGGER
# on:
#   push:
#   pull_request:
#     types: [opened, reopened]
on: [repository_dispatch, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # CINTENT >> REMOVE_MATRIX
        # python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        python-version: ['3.13']

        # CINTENT >> UNSUPPORTED_OS
        # os: [ubuntu-latest, windows-latest]
        os: [ubuntu-latest]

        # CINTENT >> REMOVE_MATRIX
        # include:
        #   - os: macos-latest
        #     python-version: '3.8'
        #   - os: macos-latest
        #     python-version: '3.13'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # CINTENT >> INSERT_CINTENT
    - uses: JavidDitty/setup-cintent@3638849e94bdb037f0a405375686a8550e6df904
      with:
        nonblocking: true

    - name: Install libomp (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
          brew install libomp
          echo 'export DYLD_LIBRARY_PATH=$(brew --prefix libomp)/lib:$DYLD_LIBRARY_PATH' >> $GITHUB_ENV

    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          python -m pip install invoke .[test]

    - name: Test with minimum versions
      run: invoke minimum

    # CINTENT >> INSERT_CINTENT
    - name: Upload CIntent Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ env.CINTENT_ARTIFACT_NAME }}
        path: ${{ env.CINTENT_LOGS }}
